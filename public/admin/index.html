<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<!-- 后台经 wrangler assets 直出不经过 Worker（前台 CSP 在 pages.ts baseHeaders），只能用 meta 兜底。
     style 允许 inline：编辑器 contenteditable 依赖 style 属性；img 需 data:（粘贴图片预览）。
     form-action 在 meta 里有效（frame-ancestors 才是 meta 无效项，走 public/_headers 响应头）；
     后台无原生表单提交（交互全走 fetch），'self' 只拦表单被改指向外域 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; media-src 'self' https:; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>博客号后台</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/admin/icon-180.png">
<meta name="theme-color" content="#b23a29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./admin.css">
</head>
<body>
<div id="app"></div>
<div id="toast-slot"></div>
<!-- 下面这行由自托管适配层（docker-poc/server.ts）在返回本文件时改写：注入一张
     importmap 把 app.js / editor.js / emoji.js 一起挂上内容版本 ?v=<hash>，
     否则后台改前端后，模块图里被静态 import 的 editor.js 仍会命中浏览器旧副本。
     标记串（script type="module" src="./app.js"）与 src/assets.ts 里的 ADMIN_ENTRY_TAG
     必须逐字一致，改这里请同步改那边。Workers 形态不注入，本行原样输出。 -->
<script type="module" src="./app.js"></script>
</body>
</html>
