# blog.xiaowuleyi.com —— 小吴乐意博客（xwblog 自托管，容器 xwblog-next → 127.0.0.1:8788）
# 回源自 Cloudflare 橙云（Flexible SSL，源站 80）：
#   - Host 头必须透传，多租户按 Host 路由，丢了会 404
#   - CF-Visitor 由边缘注入，应用 resolveScheme 据此判定访客侧是 https
server {
    listen 80;
    server_name blog.xiaowuleyi.com;
    index index.html index.htm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    client_max_body_size 100m;
    access_log /www/sites/blog.xiaowuleyi.com/log/access.log main;
    error_log /www/sites/blog.xiaowuleyi.com/log/error.log;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        # 蓝绿部署：指向 00-xwblog-upstreams.conf 里的上游，部署脚本改端口后 reload
        # 即完成切换。写死 127.0.0.1:8788 会让每次部署都断流 2–5 秒（2026-11-10 之前）。
        proxy_pass http://xwblog_main;
    }
}
