# xwblog 蓝绿部署的「流量开关」（2026-11-10）
#
# scripts/deploy-oracle.sh 部署时只改这里一行的端口号，然后
# `openresty -t && openresty -s reload`，新容器立刻接管，旧容器排空几秒后才停。
# 换容器不再是「停旧起新」，中间层始终有一个活着的上游，用户看不到 502 或超时。
#
# 改之前先看三条约束：
# 1. 一个上游一行，必须是 `upstream <名> { server 127.0.0.1:<端口>; }` 这个形态。
#    脚本是用 sed 就地替换那个数字；拆成多行、加 weight/backup 之类的参数、
#    或者换成域名，sed 都会失配。失配时脚本回读校验失败 → 放弃切换，
#    旧容器继续服务，站点不受影响（只是这次没更新）。
# 2. 本文件必须排在被引用的站点 conf 之前。nginx 解析到 proxy_pass 的当下就要能找到
#    这个 upstream，所以用 00- 前缀；1Panel 自带的 00.default.conf 里 '-' < '.'，
#    本文件仍排在它前面。
# 3. 在 1Panel 面板里重建站点会覆盖站点 conf，把 proxy_pass 写回 127.0.0.1:端口，
#    蓝绿就退化成「停旧起新」（脚本会自己发现并退回旧路径，不会出错）。
#    遇到这种情况，用 deploy/nginx/ 下的同版本覆盖回去。
#
# 备用端口 = 主端口 + 1，部署时两个端口轮流用：8788 ⇄ 8789，8790 ⇄ 8791。

upstream xwblog_main { server 127.0.0.1:8788; }
upstream xwblog_btchao { server 127.0.0.1:8790; }
