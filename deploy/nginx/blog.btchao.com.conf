# blog.btchao.com —— 比特囤币（xwblog 自托管，容器 btchao-blog → 127.0.0.1:8790）
# 与 1Panel 其它站点同构：Host 头透传是多租户路由的命脉
server {
    listen 80 ;
    server_name blog.btchao.com;
    index index.html index.htm;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    client_max_body_size 50m;

    # ---------------- 旧站（Hugo）URL 兼容：保住收录与外链 ----------------
    # 文章正文页 /posts/<slug>/ → /post/<slug>（slug 全为 ASCII）
    location ~ ^/posts/(?!page/)([^/]+)/?$ {
        return 301 https://blog.btchao.com/post/$1;
    }
    # 列表分页 /page/N/ 与 /posts/page/N/ → 新站 ?page=N
    location ~ ^/(?:posts/)?page/(\d+)/?$ {
        return 301 https://blog.btchao.com/?page=$1;
    }
    # 文章列表首页
    location = /posts/ {
        return 301 https://blog.btchao.com/;
    }
    # 分类页（Hugo taxonomy，term 是中文）
    location = /categories/比特币/ {
        return 301 https://blog.btchao.com/category/bitcoin;
    }
    location = /categories/生活随笔/ {
        return 301 https://blog.btchao.com/category/shenghuo-suibi;
    }
    location ^~ /categories/ {
        return 301 https://blog.btchao.com/;
    }
    # 标签页 /tags/<term>/ → /tag/<term>
    location = /tags/ {
        return 301 https://blog.btchao.com/;
    }
    location ~ ^/tags/(.+?)/?$ {
        return 301 https://blog.btchao.com/tag/$1;
    }

    location / {
        # 蓝绿部署：指向 00-xwblog-upstreams.conf 里的上游，部署脚本改端口后 reload
        # 即完成切换。写死 127.0.0.1:8790 会让每次部署都断流 2–5 秒（2026-11-10 之前）。
        proxy_pass http://xwblog_btchao;
    }
}
